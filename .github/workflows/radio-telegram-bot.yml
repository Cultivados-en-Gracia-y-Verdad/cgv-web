name: Radio Telegram bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radio-telegram-bot
  cancel-in-progress: false

jobs:
  post-now-playing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for track change and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set yet; skipping."
            exit 0
          fi

          current=$(curl -sf "https://api.radioking.io/widget/radio/cgv/track/current?format=json")
          current_id=$(echo "$current" | jq -r '.id // empty')
          last_id=$(jq -r '.trackId // empty' radio-bot/state.json)

          if [ -z "$current_id" ] || [ "$current_id" = "$last_id" ]; then
            echo "No track change (current=$current_id last=$last_id). Nothing to do."
            exit 0
          fi

          title=$(echo "$current" | jq -r '.title // "Sin título"')
          artist=$(echo "$current" | jq -r '.artist // "Radio CGV"')

          next=$(curl -sf "https://api.radioking.io/widget/radio/cgv/track/next?format=json" || echo "[]")
          next_title=$(echo "$next" | jq -r '.[0].title // empty')
          next_artist=$(echo "$next" | jq -r '.[0].artist // empty')

          text="🎵 Now playing: ${title} — ${artist}"
          if [ -n "$next_title" ]; then
            text="${text}
⏭ Up next: ${next_title}${next_artist:+ — $next_artist}"
          fi

          response=$(curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}")

          message_id=$(echo "$response" | jq -r '.result.message_id // empty')

          if [ -z "$message_id" ]; then
            echo "Telegram did not return a message_id. Response: $response"
            exit 1
          fi

          jq -n --arg trackId "$current_id" --argjson messageId "$message_id" \
            '{trackId: $trackId, messageId: $messageId}' > radio-bot/state.json

          git config user.name "cgv-radio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio-bot/state.json
          git commit -m "Radio: now playing ${title} — ${artist}"
          git push
